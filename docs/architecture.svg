<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title>solar-calc 架构图</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#111">solar-calc 架构：数字只有一个来源</text>

  <g font-size="14" fill="#111">
    <rect x="20" y="80" width="160" height="150" rx="10" fill="#fff4e0" stroke="#d99a2b"/>
    <text x="100" y="106" text-anchor="middle" font-weight="600">data/*.json</text>
    <text x="100" y="134" text-anchor="middle" font-size="12">postcodes-vic</text>
    <text x="100" y="154" text-anchor="middle" font-size="12">stc-zones</text>
    <text x="100" y="174" text-anchor="middle" font-size="12">battery-rebate</text>
    <text x="100" y="194" text-anchor="middle" font-size="12">defaults-vic</text>
    <text x="100" y="216" text-anchor="middle" font-size="11" fill="#555">每条带来源和核对日期</text>

    <rect x="220" y="105" width="150" height="100" rx="10" fill="#e8f1ff" stroke="#3b78d8"/>
    <text x="295" y="140" text-anchor="middle" font-weight="600">schema.ts</text>
    <text x="295" y="162" text-anchor="middle" font-size="12">Zod 范围校验</text>
    <text x="295" y="182" text-anchor="middle" font-size="11" fill="#b3261e">超范围 → 构建失败</text>

    <rect x="410" y="105" width="150" height="100" rx="10" fill="#e8f1ff" stroke="#3b78d8"/>
    <text x="485" y="140" text-anchor="middle" font-weight="600">calc.ts</text>
    <text x="485" y="162" text-anchor="middle" font-size="12">纯函数计算</text>
    <text x="485" y="182" text-anchor="middle" font-size="11" fill="#555">Vitest 对照手算</text>

    <rect x="600" y="70" width="160" height="70" rx="10" fill="#e9f7ef" stroke="#2e9d5b"/>
    <text x="680" y="100" text-anchor="middle" font-weight="600">/zh/ 中文页面</text>
    <text x="680" y="122" text-anchor="middle" font-size="12">i18n/zh.json</text>

    <rect x="600" y="170" width="160" height="70" rx="10" fill="#e9f7ef" stroke="#2e9d5b"/>
    <text x="680" y="200" text-anchor="middle" font-weight="600">/en/ 英文页面</text>
    <text x="680" y="222" text-anchor="middle" font-size="12">i18n/en.json</text>

    <rect x="800" y="115" width="140" height="80" rx="10" fill="#f1f1f1" stroke="#555"/>
    <text x="870" y="148" text-anchor="middle" font-weight="600">Vercel</text>
    <text x="870" y="170" text-anchor="middle" font-size="12">静态部署</text>
  </g>

  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="155" x2="218" y2="155"/>
    <line x1="370" y1="155" x2="408" y2="155"/>
    <line x1="560" y1="140" x2="598" y2="110"/>
    <line x1="560" y1="170" x2="598" y2="200"/>
    <line x1="760" y1="110" x2="798" y2="140"/>
    <line x1="760" y1="200" x2="798" y2="172"/>
  </g>
  <text x="480" y="280" text-anchor="middle" font-size="12" fill="#555">所有计算在用户浏览器里完成，不收集任何个人数据</text>
</svg>
